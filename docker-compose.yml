services:
  db:
    image: mariadb:11
    container_name: sdt-db
    restart: always
    environment:
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql

  app:
    image: ghcr.io/shizulka/sdt:latest
    container_name: sdt-app
    restart: always
    depends_on:
      - db
    environment:
      DATABASE_URL: mysql+pymysql://${DB_USER}:${DB_PASSWORD}@db:3306/${DB_NAME}
    ports:
      - "8000:8000"

volumes:
  db_data:
name: CI

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]

jobs:
  lint-test:
    runs-on: ubuntu-latest

    services:
      db:
        image: mariadb:11
        env:
          MYSQL_DATABASE: mywebapp
          MYSQL_USER: app
          MYSQL_PASSWORD: 12345678
          MYSQL_ROOT_PASSWORD: rootpassword
        ports:
          - 3306:3306

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 pytest pytest-cov pymysql
          pip install -r requirements.txt

      - name: Python lint
        run: |
          flake8 src --max-line-length=120 || true

      - name: Run tests with coverage
        env:
          DATABASE_URL: mysql+pymysql://app:12345678@127.0.0.1:3306/mywebapp
        run: |
          PYTHONPATH=. pytest --cov=src --cov-report=term --cov-report=html --cov-fail-under=40

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: htmlcov

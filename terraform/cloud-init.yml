#cloud-config


hostname: ${hostname}
manage_etc_hosts: true

ssh_pwauth: true

users:
  - default

  - name: ansible
    groups: sudo
    shell: /bin/bash
    sudo: ALL=(ALL) NOPASSWD:ALL
    lock_passwd: false
    plain_text_passwd: "12345678"

  - name: teacher
    groups: sudo
    shell: /bin/bash
    sudo: ALL=(ALL) ALL
    lock_passwd: false
    plain_text_passwd: "12345678"

package_update: true

packages:
  - python3
  - python3-pip
  - openssh-server

runcmd:
  - systemctl enable ssh
  - systemctl restart ssh
  - mkdir -p /home/student
  - echo "18" > /home/student/gradebook

growpart:
  mode: auto
  devices: ['/']

resize_rootfs: true

- name: Install Python and pip
  apt:
    name:
      - python3
      - python3-pip
    state: present

- name: Create app user
  user:
    name: app
    system: yes
    shell: /usr/sbin/nologin

- name: Create app directory
  file:
    path: /opt/lab4app
    state: directory
    owner: app
    group: app
    mode: '0755'

- name: Create simple app
  copy:
    dest: /opt/lab4app/app.py
    owner: app
    group: app
    mode: '0644'
    content: |
      from http.server import BaseHTTPRequestHandler, HTTPServer

      class Handler(BaseHTTPRequestHandler):
          def do_GET(self):
              if self.path == "/health/alive":
                  self.send_response(200)
                  self.end_headers()
                  self.wfile.write(b"alive")
              elif self.path == "/health/ready":
                  self.send_response(200)
                  self.end_headers()
                  self.wfile.write(b"ready")
              else:
                  self.send_response(200)
                  self.end_headers()
                  self.wfile.write(b"Lab 4 app works")

      HTTPServer(("127.0.0.1", {{ app_port }}), Handler).serve_forever()

- name: Create app systemd service
  copy:
    dest: /etc/systemd/system/lab4app.service
    content: |
      [Unit]
      Description=Lab4 Web Application
      After=network.target

      [Service]
      User=app
      WorkingDirectory=/opt/lab4app
      ExecStart=/usr/bin/python3 /opt/lab4app/app.py
      Restart=always

      [Install]
      WantedBy=multi-user.target

- name: Start app service
  systemd:
    name: lab4app
    state: restarted
    enabled: yes
    daemon_reload: yes

- name: Create operator user
  user:
    name: operator
    shell: /bin/bash
    password: "{{ '12345678' | password_hash('sha512') }}"

- name: Configure operator sudo permissions
  copy:
    dest: /etc/sudoers.d/operator-lab4
    mode: '0440'
    content: |
      operator ALL=(root) NOPASSWD: /bin/systemctl start lab4app, /bin/systemctl stop lab4app, /bin/systemctl restart lab4app, /bin/systemctl status lab4app, /bin/systemctl reload nginx

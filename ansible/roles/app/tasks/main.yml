- name: Install Python and pip
  apt:
    name:
      - python3
      - python3-pip
      - python3-venv
      - rsync
    state: present

- name: Create app user
  user:
    name: app
    system: yes
    shell: /usr/sbin/nologin

- name: Create app directory
  file:
    path: /opt/mywebapp
    state: directory
    owner: app
    group: app
    mode: '0755'

- name: Copy application source
  synchronize:
    src: "{{ playbook_dir }}/../src/"
    dest: /opt/mywebapp/src/
    delete: yes
    recursive: yes

- name: Copy requirements
  copy:
    src: "{{ playbook_dir }}/../requirements.txt"
    dest: /opt/mywebapp/requirements.txt
    owner: app
    group: app
    mode: '0644'

- name: Fix application ownership
  file:
    path: /opt/mywebapp
    owner: app
    group: app
    recurse: yes

- name: Install Python dependencies
  pip:
    requirements: /opt/mywebapp/requirements.txt
    executable: pip3

- name: Create application environment file
  template:
    src: mywebapp.env.j2
    dest: /opt/mywebapp/.env
    owner: app
    group: app
    mode: '0644'

- name: Create app systemd service
  template:
    src: mywebapp.service.j2
    dest: /etc/systemd/system/lab4app.service
    mode: '0644'

- name: Start app service
  systemd:
    name: lab4app
    state: restarted
    enabled: yes
    daemon_reload: yes

- name: Create operator user
  user:
    name: operator
    shell: /bin/bash
    password: "{{ '12345678' | password_hash('sha512') }}"

- name: Configure operator sudo permissions
  copy:
    dest: /etc/sudoers.d/operator-lab4
    mode: '0440'
    content: |
      operator ALL=(root) NOPASSWD: /bin/systemctl start lab4app, /bin/systemctl stop lab4app, /bin/systemctl restart lab4app, /bin/systemctl status lab4app, /bin/systemctl reload nginx

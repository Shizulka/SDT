- name: Install nginx
  apt:
    name: nginx
    state: present

- name: Configure nginx reverse proxy
  copy:
    dest: /etc/nginx/sites-available/lab4app
    content: |
      server {
          listen 80;

          location / {
              proxy_pass http://127.0.0.1:{{ app_port }};
          }
      }

- name: Enable nginx site
  file:
    src: /etc/nginx/sites-available/lab4app
    dest: /etc/nginx/sites-enabled/lab4app
    state: link

- name: Remove default nginx site
  file:
    path: /etc/nginx/sites-enabled/default
    state: absent

- name: Restart nginx
  systemd:
    name: nginx
    state: restarted
    enabled: yes
